version: '3.8'

services:
  fasttools:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: fasttools-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    # Use environment file (supports .env format)
    env_file:
      - .env.production
    # Or use YAML file by converting first (see README-DOCKER.md)
    # environment:
    #   - NODE_ENV=production
    volumes:
      # Optional: Mount models directory if you want to update models without rebuilding
      - ./public/models:/app/public/models:ro
      # Optional: Logs directory
      - ./logs:/app/logs
    networks:
      - fasttools-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/instagram/test"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits (adjust based on your server)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

networks:
  fasttools-network:
    driver: bridge

