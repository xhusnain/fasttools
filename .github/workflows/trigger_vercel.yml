name: Deploy Vercel

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Commit message for the empty commit'
        required: false
        default: 'Empty commit triggered by workflow'
        type: string

jobs:
  create-empty-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "Husnain"
          git config --global user.email "husnain.babar.dev@gmail.com"

      - name: Create empty commit
        run: |
          git commit --allow-empty -m "${{ github.event.inputs.commit_message || 'Empty commit triggered by workflow' }}"
          git push origin main
