name: CI/CD - Build and Push to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate secrets are set
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "Error: AWS_ACCESS_KEY_ID secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "Error: AWS_SECRET_ACCESS_KEY secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.AWS_REGION }}" ]; then
            echo "Error: AWS_REGION secret is not set"
            exit 1
          fi
          
          # Check Access Key ID format (should start with AKIA for IAM user or ASIA for temp)
          ACCESS_KEY="${{ secrets.AWS_ACCESS_KEY_ID }}"
          if [[ ! "$ACCESS_KEY" =~ ^(AKIA|ASIA)[A-Z0-9]{16}$ ]]; then
            echo "Warning: AWS_ACCESS_KEY_ID format may be incorrect (should be 20 chars, starting with AKIA or ASIA)"
          fi
          
          # Check Secret Access Key length (should be ~40 chars)
          SECRET_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          if [ ${#SECRET_KEY} -lt 30 ] || [ ${#SECRET_KEY} -gt 50 ]; then
            echo "Warning: AWS_SECRET_ACCESS_KEY length seems incorrect (should be ~40 characters)"
          fi
          
          echo "All required secrets are set"
          echo "Region: ${{ secrets.AWS_REGION }}"
          echo "Access Key ID prefix: ${ACCESS_KEY:0:4}..."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: false

      - name: Verify AWS credentials
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.ECR_REPOSITORY }} .

      - name: Tag Docker image
        run: |
          docker tag ${{ secrets.ECR_REPOSITORY }}:latest ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest

      - name: Push Docker image to ECR
        run: |
          docker push ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest

      - name: Print image URI
        run: |
          echo "Image pushed: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest"
