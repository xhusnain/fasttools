name: Flagship uptime (Instagram DP)

# Why this exists: the Instagram DP tool is the site's traffic core, and it
# depends on a self-hosted phone-tether proxy that drops silently. On 2026-07-24
# it had been erroring in production for 11+ days with no alert, nullifying the
# whole SEO recovery. This job checks the live tool every 15 min and FAILS
# (→ GitHub emails the repo owner) when it's genuinely down.
#
# It only tests the public tool — no secrets, no server access. Fixing a down
# tool still requires checking the phone egress (see docs/seo).

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes (GitHub may delay under load)
  workflow_dispatch: {}

# Don't pile up overlapping runs.
concurrency:
  group: flagship-uptime
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe /api/instagram/profile (with retries)
        env:
          # Stable username that always exists; verified public account.
          IG_USER: instagram
          ENDPOINT: https://fasttools.store/api/instagram/profile
        run: |
          set -uo pipefail

          # Retry up to 3 times over ~90s so a single transient blip doesn't
          # false-alarm. Success = HTTP 200 + a real profile_pic_url in the JSON.
          attempt=0
          max=3
          ok=0
          last=""
          while [ "$attempt" -lt "$max" ]; do
            attempt=$((attempt+1))
            body="$(curl -s --max-time 30 -A 'Mozilla/5.0' "${ENDPOINT}?username=${IG_USER}")"
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -A 'Mozilla/5.0' "${ENDPOINT}?username=${IG_USER}")"
            last="HTTP ${code} :: ${body:0:300}"
            pic="$(printf '%s' "$body" | jq -r '.data.profile_pic_url // empty' 2>/dev/null || true)"
            if [ "$code" = "200" ] && printf '%s' "$pic" | grep -qE '^https?://'; then
              echo "✅ Flagship healthy on attempt ${attempt}: ${pic:0:80}..."
              ok=1
              break
            fi
            echo "⚠️  Attempt ${attempt}/${max} failed: ${last}"
            [ "$attempt" -lt "$max" ] && sleep 30
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error title=Flagship DOWN::Instagram DP tool is not returning a valid profile. Last response: ${last}"
            echo ""
            echo "Likely cause: phone-tether egress dropped. Restart relay:"
            echo "  ssh root@47.84.202.125 'pm2 restart tetherproxy-relay'"
            echo "Then confirm the phone is online and the TetherProxy egress app is connected."
            exit 1
          fi

      - name: Optional alert webhook (only if secret is set)
        # Wire ALERT_WEBHOOK_URL (Slack/Telegram/Discord incoming webhook) in
        # repo secrets to also get a push notification. Skipped if unset.
        if: failure() && env.ALERT_WEBHOOK_URL != ''
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          curl -s -X POST -H 'Content-Type: application/json' \
            -d '{"text":"🚨 FastTools flagship (Instagram DP tool) is DOWN. Check phone egress / restart tetherproxy-relay."}' \
            "$ALERT_WEBHOOK_URL" || true
