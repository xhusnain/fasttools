<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium Orange Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff7420;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9d42;stop-opacity:1" />
    </linearGradient>
    
    <!-- Sophisticated Black -->
    <linearGradient id="blackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle Glow -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Professional Shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Main Circle Background -->
  <circle cx="100" cy="100" r="85" fill="url(#blackGrad)" filter="url(#shadow)"/>
  
  <!-- Elegant Border -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#orangeGrad)" stroke-width="2"/>
  
  <!-- Inner Border -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="url(#orangeGrad)" stroke-width="1" opacity="0.3"/>
  
  <!-- Clean Grid System -->
  <g opacity="0.15" stroke="url(#orangeGrad)" stroke-width="1">
    <!-- Horizontal lines -->
    <line x1="55" y1="55" x2="145" y2="55"/>
    <line x1="55" y1="100" x2="145" y2="100"/>
    <line x1="55" y1="145" x2="145" y2="145"/>
    
    <!-- Vertical lines -->
    <line x1="55" y1="55" x2="55" y2="145"/>
    <line x1="100" y1="55" x2="100" y2="145"/>
    <line x1="145" y1="55" x2="145" y2="145"/>
  </g>
  
  <!-- Professional Tool Icons -->
  <g filter="url(#softGlow)">
    
    <!-- Row 1: AI, Calculator, Image -->
    
    <!-- AI Brain Icon -->
    <g transform="translate(55, 55)">
      <circle cx="0" cy="0" r="6" fill="none" stroke="url(#orangeGrad)" stroke-width="2"/>
      <circle cx="-4" cy="-4" r="1.5" fill="url(#orangeGrad)"/>
      <circle cx="4" cy="-4" r="1.5" fill="url(#orangeGrad)"/>
      <circle cx="4" cy="4" r="1.5" fill="url(#orangeGrad)"/>
      <circle cx="-4" cy="4" r="1.5" fill="url(#orangeGrad)"/>
    </g>
    
    <!-- Calculator Icon -->
    <g transform="translate(100, 55)">
      <rect x="-6" y="-6" width="12" height="12" rx="1.5" fill="url(#orangeGrad)"/>
      <rect x="-4" y="-4" width="8" height="3" rx="0.5" fill="#0a0a0a"/>
      <circle cx="-2.5" cy="1.5" r="1" fill="#0a0a0a"/>
      <circle cx="0" cy="1.5" r="1" fill="#0a0a0a"/>
      <circle cx="2.5" cy="1.5" r="1" fill="#0a0a0a"/>
    </g>
    
    <!-- Image Icon -->
    <g transform="translate(145, 55)">
      <rect x="-6" y="-6" width="12" height="12" rx="1" fill="none" stroke="url(#orangeGrad)" stroke-width="1.5"/>
      <circle cx="-3" cy="-3" r="1.5" fill="url(#orangeGrad)"/>
      <path d="M -6 3 L -2 -1 L 2 3 L 6 0 L 6 6 L -6 6 Z" fill="url(#orangeGrad)"/>
    </g>
    
    <!-- Row 2: Converter, Lightning (Center), SEO -->
    
    <!-- Converter Icon -->
    <g transform="translate(55, 100)">
      <path d="M -5 -2 L 5 -2 L 3 -4 M 5 -2 L 3 0" 
            stroke="url(#orangeGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M 5 2 L -5 2 L -3 4 M -5 2 L -3 0" 
            stroke="url(#orangeGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    
    <!-- Center Lightning (FAST) -->
    <g transform="translate(100, 100)">
      <circle cx="0" cy="0" r="10" fill="url(#orangeGrad)" opacity="0.15"/>
      <path d="M 2 -9 L -4 1 L 0 1 L -3 9 L 5 -1 L 1 -1 Z" 
            fill="url(#orangeGrad)"/>
    </g>
    
    <!-- SEO Search Icon -->
    <g transform="translate(145, 100)">
      <circle cx="-2" cy="-2" r="4" fill="none" stroke="url(#orangeGrad)" stroke-width="1.5"/>
      <line x1="1" y1="1" x2="5" y2="5" stroke="url(#orangeGrad)" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M -5 3 L -3 1 L -1 4 L 1 2" stroke="url(#orangeGrad)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    </g>
    
    <!-- Row 3: PDF, Code, Social -->
    
    <!-- PDF Document Icon -->
    <g transform="translate(55, 145)">
      <rect x="-5" y="-6" width="10" height="12" rx="1" fill="url(#orangeGrad)"/>
      <line x1="-3" y1="-3" x2="3" y2="-3" stroke="#0a0a0a" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="-3" y1="0" x2="3" y2="0" stroke="#0a0a0a" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="-3" y1="3" x2="1" y2="3" stroke="#0a0a0a" stroke-width="1.2" stroke-linecap="round"/>
    </g>
    
    <!-- Code Brackets Icon -->
    <g transform="translate(100, 145)">
      <path d="M -6 -4 L -7 0 L -6 4" stroke="url(#orangeGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M 6 -4 L 7 0 L 6 4" stroke="url(#orangeGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>
      <line x1="-2" y1="-5" x2="2" y2="5" stroke="url(#orangeGrad)" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    
    <!-- Social Network Icon -->
    <g transform="translate(145, 145)">
      <circle cx="-4" cy="-3" r="2" fill="url(#orangeGrad)"/>
      <circle cx="4" cy="-2" r="2" fill="url(#orangeGrad)"/>
      <circle cx="1" cy="4" r="2" fill="url(#orangeGrad)"/>
      <line x1="-2.5" y1="-2" x2="2.5" y2="-1.5" stroke="url(#orangeGrad)" stroke-width="1.2"/>
      <line x1="3" y1="0" x2="1.5" y2="2.5" stroke="url(#orangeGrad)" stroke-width="1.2"/>
      <line x1="-2.5" y1="-1.5" x2="0" y2="2.5" stroke="url(#orangeGrad)" stroke-width="1" opacity="0.6"/>
    </g>
    
  </g>
  
  <!-- Minimalist Corner Accents -->
  <g stroke="url(#orangeGrad)" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <line x1="30" y1="30" x2="30" y2="40"/>
    <line x1="30" y1="30" x2="40" y2="30"/>
    
    <line x1="170" y1="30" x2="170" y2="40"/>
    <line x1="170" y1="30" x2="160" y2="30"/>
    
    <line x1="30" y1="170" x2="30" y2="160"/>
    <line x1="30" y1="170" x2="40" y2="170"/>
    
    <line x1="170" y1="170" x2="170" y2="160"/>
    <line x1="170" y1="170" x2="160" y2="170"/>
  </g>
  
  <!-- Subtle Outer Ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#orangeGrad)" stroke-width="0.5" opacity="0.2"/>
  
</svg>