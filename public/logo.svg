<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Molten Orange -->
    <linearGradient id="moltenOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4500;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c42;stop-opacity:1" />
    </linearGradient>
    
    <!-- Liquid Black -->
    <radialGradient id="liquidBlack">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>
    
    <!-- Orange Glow -->
    <radialGradient id="orangeGlow">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ff4500;stop-opacity:0" />
    </radialGradient>
    
    <!-- Powerful Glow -->
    <filter id="powerGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Deep Shadow -->
    <filter id="deepShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="85" fill="url(#orangeGlow)"/>
  
  <!-- Main Twisted Infinity Shape (Möbius Strip Concept) -->
  <g filter="url(#deepShadow)">
    <!-- Left Loop -->
    <path d="M 50 100 Q 30 70 50 50 Q 70 30 100 40 Q 85 60 75 80 Z" 
          fill="url(#liquidBlack)" 
          stroke="url(#moltenOrange)" 
          stroke-width="3"/>
    
    <!-- Right Loop -->
    <path d="M 150 100 Q 170 130 150 150 Q 130 170 100 160 Q 115 140 125 120 Z" 
          fill="url(#liquidBlack)" 
          stroke="url(#moltenOrange)" 
          stroke-width="3"/>
    
    <!-- Center Crossover (3D Twist Effect) -->
    <ellipse cx="100" cy="100" rx="30" ry="45" 
             fill="url(#liquidBlack)" 
             stroke="url(#moltenOrange)" 
             stroke-width="3"
             transform="rotate(20 100 100)"/>
  </g>
  
  <!-- Floating Tool Particles (Orbiting the Center) -->
  <g filter="url(#powerGlow)">
    
    <!-- Particle 1: AI Chip (Top) -->
    <g transform="translate(100, 30)">
      <rect x="-6" y="-6" width="12" height="12" rx="2" fill="url(#moltenOrange)"/>
      <circle cx="-3" cy="-3" r="1" fill="#000"/>
      <circle cx="3" cy="-3" r="1" fill="#000"/>
      <circle cx="-3" cy="3" r="1" fill="#000"/>
      <circle cx="3" cy="3" r="1" fill="#000"/>
      <line x1="-6" y1="0" x2="-8" y2="0" stroke="url(#moltenOrange)" stroke-width="1"/>
      <line x1="6" y1="0" x2="8" y2="0" stroke="url(#moltenOrange)" stroke-width="1"/>
    </g>
    
    <!-- Particle 2: Converter Symbol (Top Right) -->
    <g transform="translate(155, 55)">
      <circle cx="0" cy="0" r="7" fill="url(#moltenOrange)" opacity="0.3"/>
      <path d="M -4 -2 L 4 -2 L 2 -4 M 4 2 L -4 2 L -2 4" 
            stroke="url(#moltenOrange)" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
    
    <!-- Particle 3: Code Slash (Right) -->
    <g transform="translate(170, 100)">
      <line x1="-5" y1="-6" x2="5" y2="6" stroke="url(#moltenOrange)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-5" cy="-6" r="2" fill="url(#moltenOrange)"/>
      <circle cx="5" cy="6" r="2" fill="url(#moltenOrange)"/>
    </g>
    
    <!-- Particle 4: Image Frame (Bottom Right) -->
    <g transform="translate(155, 145)">
      <rect x="-6" y="-6" width="12" height="12" rx="1" fill="none" stroke="url(#moltenOrange)" stroke-width="2"/>
      <circle cx="-3" cy="-3" r="1.5" fill="url(#moltenOrange)"/>
      <path d="M -6 3 L -2 -1 L 2 3 L 6 0 L 6 6 L -6 6 Z" fill="url(#moltenOrange)"/>
    </g>
    
    <!-- Particle 5: Document (Bottom) -->
    <g transform="translate(100, 170)">
      <rect x="-5" y="-6" width="10" height="12" rx="1" fill="url(#moltenOrange)"/>
      <line x1="-3" y1="-3" x2="3" y2="-3" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="-3" y1="0" x2="3" y2="0" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="-3" y1="3" x2="1" y2="3" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
    </g>
    
    <!-- Particle 6: Search Lens (Bottom Left) -->
    <g transform="translate(45, 145)">
      <circle cx="-2" cy="-2" r="4" fill="none" stroke="url(#moltenOrange)" stroke-width="2"/>
      <line x1="1" y1="1" x2="5" y2="5" stroke="url(#moltenOrange)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="5" cy="5" r="1.5" fill="url(#moltenOrange)"/>
    </g>
    
    <!-- Particle 7: Calculator Grid (Left) -->
    <g transform="translate(30, 100)">
      <rect x="-6" y="-6" width="12" height="12" rx="1.5" fill="url(#moltenOrange)"/>
      <circle cx="-3" cy="-2" r="1" fill="#000"/>
      <circle cx="0" cy="-2" r="1" fill="#000"/>
      <circle cx="3" cy="-2" r="1" fill="#000"/>
      <circle cx="-3" cy="2" r="1" fill="#000"/>
      <circle cx="0" cy="2" r="1" fill="#000"/>
      <circle cx="3" cy="2" r="1" fill="#000"/>
    </g>
    
    <!-- Particle 8: Network Nodes (Top Left) -->
    <g transform="translate(45, 55)">
      <circle cx="-3" cy="-3" r="2" fill="url(#moltenOrange)"/>
      <circle cx="3" cy="-2" r="2" fill="url(#moltenOrange)"/>
      <circle cx="0" cy="4" r="2" fill="url(#moltenOrange)"/>
      <line x1="-3" y1="-3" x2="3" y2="-2" stroke="url(#moltenOrange)" stroke-width="1.5"/>
      <line x1="3" y1="-2" x2="0" y2="4" stroke="url(#moltenOrange)" stroke-width="1.5"/>
      <line x1="0" y1="4" x2="-3" y2="-3" stroke="url(#moltenOrange)" stroke-width="1.5"/>
    </g>
  </g>
  
  <!-- Center Core: Lightning Burst -->
  <g transform="translate(100, 100)" filter="url(#powerGlow)">
    <!-- Energy Core -->
    <circle cx="0" cy="0" r="20" fill="url(#moltenOrange)" opacity="0.2"/>
    <circle cx="0" cy="0" r="15" fill="url(#moltenOrange)" opacity="0.3"/>
    <circle cx="0" cy="0" r="10" fill="url(#moltenOrange)" opacity="0.4"/>
    
    <!-- Multi-directional Lightning -->
    <path d="M 0 -12 L -3 -2 L 0 -2 L -2 5" stroke="url(#moltenOrange)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 8 -8 L 2 0 L 4 0 L 1 6" stroke="url(#moltenOrange)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 12 0 L 3 2 L 5 3 L 2 8" stroke="url(#moltenOrange)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 8 8 L 1 3 L 2 1 L -2 6" stroke="url(#moltenOrange)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 0 12 L 2 2 L 0 2 L 3 -5" stroke="url(#moltenOrange)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M -8 8 L -1 1 L -3 0 L 1 -6" stroke="url(#moltenOrange)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M -12 0 L -3 -1 L -5 -2 L -1 -8" stroke="url(#moltenOrange)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M -8 -8 L -2 -1 L -3 1 L 2 -5" stroke="url(#moltenOrange)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    
    <!-- Center Bright Core -->
    <circle cx="0" cy="0" r="5" fill="url(#moltenOrange)"/>
    <circle cx="0" cy="0" r="3" fill="#ff8c42"/>
  </g>
  
  <!-- Orbital Paths (Subtle) -->
  <g stroke="url(#moltenOrange)" stroke-width="0.5" fill="none" opacity="0.2">
    <ellipse cx="100" cy="100" rx="70" ry="40" transform="rotate(30 100 100)"/>
    <ellipse cx="100" cy="100" rx="70" ry="40" transform="rotate(-30 100 100)"/>
    <ellipse cx="100" cy="100" rx="60" ry="60"/>
  </g>
  
  <!-- Outer Energy Ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#moltenOrange)" stroke-width="1.5" opacity="0.4" stroke-dasharray="5,5"/>
  
  <!-- Corner Energy Sparks -->
  <g fill="url(#moltenOrange)">
    <path d="M 15 15 L 18 20 L 20 18 Z" opacity="0.6"/>
    <path d="M 185 15 L 182 20 L 180 18 Z" opacity="0.6"/>
    <path d="M 15 185 L 18 180 L 20 182 Z" opacity="0.6"/>
    <path d="M 185 185 L 182 180 L 180 182 Z" opacity="0.6"/>
  </g>
</svg>