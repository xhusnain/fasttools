<svg width="320" height="80" viewBox="0 0 320 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Modern square with rounded corners - inspired by NetApp style -->
  <rect x="8" y="8" width="64" height="64" rx="16" ry="16" fill="url(#iconGradient)" stroke="#0284c7" stroke-width="1"/>
  
  <!-- Abstract 'F' and 'T' combined - modern typography approach -->
  <g transform="translate(24, 24)">
    <!-- F shape -->
    <rect x="8" y="8" width="4" height="24" fill="white" rx="1" ry="1"/>
    <rect x="8" y="8" width="16" height="4" fill="white" rx="1" ry="1"/>
    <rect x="8" y="16" width="12" height="4" fill="white" rx="1" ry="1"/>
    
    <!-- T shape -->
    <rect x="20" y="8" width="16" height="4" fill="white" rx="1" ry="1"/>
    <rect x="26" y="8" width="4" height="24" fill="white" rx="1" ry="1"/>
    
    <!-- Connecting element -->
    <rect x="16" y="20" width="8" height="4" fill="white" rx="1" ry="1"/>
  </g>
  
  <!-- Modern typography with better spacing -->
  <text x="90" y="42" font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="700" fill="url(#textGradient)" letter-spacing="-1px">FastTools</text>
  
  <!-- Professional subtitle -->
  <text x="90" y="62" font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b" letter-spacing="0.3px">Free Online Tools &amp; Utilities</text>
</svg>
