<svg width="192" height="192" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Modern rounded square background -->
  <rect x="12" y="12" width="168" height="168" rx="36" ry="36" fill="url(#iconGradient)" stroke="#0284c7" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Abstract 'F' and 'T' combined -->
  <g transform="translate(48, 48)">
    <!-- F shape -->
    <rect x="12" y="12" width="8" height="48" fill="white" rx="2" ry="2"/>
    <rect x="12" y="12" width="32" height="8" fill="white" rx="2" ry="2"/>
    <rect x="12" y="28" width="24" height="8" fill="white" rx="2" ry="2"/>
    
    <!-- T shape -->
    <rect x="48" y="12" width="32" height="8" fill="white" rx="2" ry="2"/>
    <rect x="60" y="12" width="8" height="48" fill="white" rx="2" ry="2"/>
    
    <!-- Connecting element -->
    <rect x="36" y="48" width="16" height="8" fill="white" rx="2" ry="2"/>
  </g>
</svg>
