<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Modern rounded square background for iOS -->
  <rect x="0" y="0" width="180" height="180" rx="40" ry="40" fill="url(#iconGradient)" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Abstract 'F' and 'T' combined -->
  <g transform="translate(45, 45)">
    <!-- F shape -->
    <rect x="15" y="15" width="6" height="36" fill="white" rx="1.5" ry="1.5"/>
    <rect x="15" y="15" width="24" height="6" fill="white" rx="1.5" ry="1.5"/>
    <rect x="15" y="30" width="18" height="6" fill="white" rx="1.5" ry="1.5"/>
    
    <!-- T shape -->
    <rect x="45" y="15" width="24" height="6" fill="white" rx="1.5" ry="1.5"/>
    <rect x="54" y="15" width="6" height="36" fill="white" rx="1.5" ry="1.5"/>
    
    <!-- Connecting element -->
    <rect x="36" y="42" width="12" height="6" fill="white" rx="1.5" ry="1.5"/>
  </g>
</svg>
