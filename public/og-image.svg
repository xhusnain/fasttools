<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f2937;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Professional background -->
  <rect width="1200" height="630" fill="url(#backgroundGradient)"/>
  
  <!-- Subtle decorative elements -->
  <circle cx="100" cy="100" r="40" fill="#3b82f6" opacity="0.05"/>
  <circle cx="1100" cy="530" r="60" fill="#1d4ed8" opacity="0.05"/>
  <circle cx="1000" cy="150" r="25" fill="#2563eb" opacity="0.05"/>
  
  <!-- Main logo area -->
  <g transform="translate(100, 120)">
    <!-- Professional icon background -->
    <rect x="0" y="0" width="120" height="120" rx="24" ry="24" fill="url(#iconGradient)" stroke="#1e40af" stroke-width="3" filter="url(#shadow)"/>
    
    <!-- Professional tool icon -->
    <g transform="translate(30, 30)">
      <!-- Main tool shape -->
      <path d="M30 15 L30 45 L45 45 L45 60 L75 60 L75 45 L90 45 L90 15 L75 15 L75 30 L45 30 L45 15 Z" fill="white" stroke="none"/>
      <!-- Tool handle -->
      <rect x="15" y="30" width="15" height="15" fill="white" rx="2" ry="2"/>
      <!-- Professional accent -->
      <circle cx="60" cy="37.5" r="7.5" fill="#3b82f6"/>
    </g>
    
    <!-- Professional typography -->
    <text x="150" y="50" font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="800" fill="url(#textGradient)" letter-spacing="-1px">FastTools</text>
    
    <!-- Professional subtitle -->
    <text x="150" y="90" font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="600" fill="#6b7280" letter-spacing="0.5px">Professional Online Tools & Utilities</text>
    
    <!-- Trust indicators -->
    <g transform="translate(150, 110)">
      <circle cx="0" cy="0" r="3" fill="#10b981"/>
      <text x="12" y="5" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="600" fill="#10b981">Secure & Trusted</text>
      
      <circle cx="200" cy="0" r="3" fill="#10b981"/>
      <text x="212" y="5" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="600" fill="#10b981">Fast & Reliable</text>
      
      <circle cx="400" cy="0" r="3" fill="#10b981"/>
      <text x="412" y="5" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="600" fill="#10b981">100% Free</text>
    </g>
  </g>
  
  <!-- Professional tools showcase -->
  <g transform="translate(100, 350)">
    <rect x="0" y="0" width="1000" height="200" rx="24" ry="24" fill="white" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Tools grid with professional styling -->
    <g transform="translate(40, 30)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="140" height="50" rx="12" ry="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="20" y="32" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="600" fill="#374151">Age Calculator</text>
      
      <rect x="160" y="0" width="140" height="50" rx="12" ry="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="180" y="32" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="600" fill="#374151">BMI Calculator</text>
      
      <rect x="320" y="0" width="140" height="50" rx="12" ry="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="340" y="32" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="600" fill="#374151">QR Generator</text>
      
      <rect x="480" y="0" width="140" height="50" rx="12" ry="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="500" y="32" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="600" fill="#374151">Text Tools</text>
      
      <!-- Row 2 -->
      <rect x="0" y="70" width="140" height="50" rx="12" ry="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="20" y="102" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="600" fill="#374151">Image Tools</text>
      
      <rect x="160" y="70" width="140" height="50" rx="12" ry="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="180" y="102" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="600" fill="#374151">Converters</text>
      
      <rect x="320" y="70" width="140" height="50" rx="12" ry="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="340" y="102" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="600" fill="#374151">SEO Tools</text>
      
      <rect x="480" y="70" width="140" height="50" rx="12" ry="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="500" y="102" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="600" fill="#374151">AI Tools</text>
    </g>
  </g>
</svg>
