<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Modern rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#iconGradient)" stroke="#0284c7" stroke-width="8" filter="url(#shadow)"/>
  
  <!-- Abstract 'F' and 'T' combined -->
  <g transform="translate(128, 128)">
    <!-- F shape -->
    <rect x="32" y="32" width="20" height="128" fill="white" rx="4" ry="4"/>
    <rect x="32" y="32" width="80" height="20" fill="white" rx="4" ry="4"/>
    <rect x="32" y="72" width="60" height="20" fill="white" rx="4" ry="4"/>
    
    <!-- T shape -->
    <rect x="128" y="32" width="80" height="20" fill="white" rx="4" ry="4"/>
    <rect x="160" y="32" width="20" height="128" fill="white" rx="4" ry="4"/>
    
    <!-- Connecting element -->
    <rect x="96" y="128" width="40" height="20" fill="white" rx="4" ry="4"/>
  </g>
</svg>
