version: "3.9"

services:
  toolify-hub:
    image: husnainbabar/toolify-hub:latest
    # container_name: toolify-hub
    ports:
      - "7000:3000" # external:internal port mapping
    restart: always
    # env_file:
    #   - production.env.yaml   # ✅ external environment file
    deploy:
      replicas: 5 # 🧩 run 5 containers
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
      update_config:
        parallelism: 2
        delay: 10s
        order: start-first # zero-downtime updates
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
